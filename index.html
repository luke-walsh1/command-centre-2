<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0d1017">
<meta name="apple-mobile-web-app-title" content="Command">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" href="icons/icon-32.png">
<title>Command Centre</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{color-scheme:light;padding-block:env(safe-area-inset-top,0px) env(safe-area-inset-bottom,0px)}
body{margin:0}
[hidden]{display:none!important}
/* Layout concept: a flight-deck style personal ops board. Sticky module rail on top, a home overview of live tiles, and one focused panel per module. */
:root{
  --ah:235;
  --bg:#eceff5; --surface:#f8f9fc; --surface2:#e2e6f0; --line:#cfd5e4;
  --fg:#14182a; --muted:#566079;
  --accent:hsl(var(--ah) 62% 44%); --accent-soft:hsl(var(--ah) 70% 92%); --accent-ink:#ffffff;
  --good:#14804a; --warn:#a96400; --bad:#b3261e;
  --display:'Big Shoulders Display','Arial Narrow',Impact,sans-serif;
  --body:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0d1017; --surface:#151a24; --surface2:#1d2331; --line:#272f42;
  --fg:#e8ebf3; --muted:#8f98b0;
  --accent:hsl(var(--ah) 82% 72%); --accent-soft:hsl(var(--ah) 40% 20%); --accent-ink:#0d1017;
  --good:#4cc38a; --warn:#e0a040; --bad:#ff7a70; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1017; --surface:#151a24; --surface2:#1d2331; --line:#272f42;
  --fg:#e8ebf3; --muted:#8f98b0;
  --accent:hsl(var(--ah) 82% 72%); --accent-soft:hsl(var(--ah) 40% 20%); --accent-ink:#0d1017;
  --good:#4cc38a; --warn:#e0a040; --bad:#ff7a70; color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.5;
  padding-block:0 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;font-family:var(--display);font-weight:800;letter-spacing:.02em;text-wrap:balance;line-height:1.05}
h2{font-size:34px;text-transform:uppercase}
h3{font-size:20px;text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.wrap{max-width:1080px;margin:0 auto}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line);
  margin-inline:calc(-1*max(16px,env(safe-area-inset-left,0px))) calc(-1*max(16px,env(safe-area-inset-right,0px)));
  padding:10px max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px))}
.top-in{max-width:1080px;margin:0 auto}
.brandrow{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.brand{font-family:var(--display);font-weight:800;font-size:22px;letter-spacing:.14em;text-transform:uppercase}
.brand i{font-style:normal;color:var(--accent)}
.clock{font-family:var(--mono);font-size:15px;color:var(--muted);font-variant-numeric:tabular-nums}
.rail{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;margin-top:6px}
.rail::-webkit-scrollbar{display:none}
.rail button{flex:none;display:flex;align-items:center;gap:6px;background:none;border:0;border-bottom:2px solid transparent;padding:9px 11px;color:var(--muted);cursor:pointer;font-size:13px;font-weight:500;white-space:nowrap}
.rail button:hover{color:var(--fg)}
.rail button[aria-current="page"]{color:var(--fg);border-bottom-color:var(--accent)}
.ico{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
main{padding-top:24px;display:flex;flex-direction:column;gap:20px}
.head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:10px 16px}
.head p{margin:4px 0 0;color:var(--muted)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr))}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:16px;min-width:0}
.panel>h3{margin-bottom:12px}
.tile{display:flex;flex-direction:column;gap:6px;text-align:left;cursor:pointer;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:14px 16px;min-width:0}
.tile:hover{border-color:var(--accent)}
.tile .lab{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:6px}
.tile .big{font-family:var(--display);font-weight:800;font-size:38px;line-height:1;font-variant-numeric:tabular-nums}
.tile .sub{color:var(--muted);font-size:13px;overflow-wrap:anywhere}
.bar{height:6px;border-radius:3px;background:var(--surface2);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:3px}
.bar.over>i{background:var(--warn)}
.btn{background:var(--accent);color:var(--accent-ink);border:1px solid var(--accent);border-radius:5px;padding:8px 14px;cursor:pointer;font-weight:600;font-size:14px}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;color:var(--fg);border-color:var(--line)}
.btn.ghost:hover{border-color:var(--accent);color:var(--accent)}
.btn.danger{background:transparent;color:var(--bad);border-color:var(--bad)}
.btn.sm{padding:4px 10px;font-size:13px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input,select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:5px;padding:8px 10px;min-width:0;max-width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}
textarea{width:100%;min-height:90px;resize:vertical}
input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent);padding:0}
.form{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.form input[type=text],.form input:not([type]){flex:1 1 160px}
.form input[type=number]{width:96px}
.lab2{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.empty{color:var(--muted);padding:18px 4px;text-align:center;border:1px dashed var(--line);border-radius:6px}
.list{display:flex;flex-direction:column;gap:0;margin:0;padding:0;list-style:none}
.list>li{display:flex;align-items:center;gap:10px;padding:10px 2px;border-bottom:1px solid var(--line);min-width:0}
.list>li:last-child{border-bottom:0}
.list .grow{flex:1;min-width:0;overflow-wrap:anywhere}
.done{text-decoration:line-through;color:var(--muted)}
.scroll{overflow-x:auto}
/* habits */
table.hab{border-collapse:collapse;width:100%;min-width:560px}
.hab th{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:500;padding:6px 4px;text-align:center}
.hab th:first-child,.hab td:first-child{text-align:left}
.hab td{padding:6px 4px;border-top:1px solid var(--line);text-align:center}
.hab th.today{color:var(--accent)}
.dot{width:30px;height:30px;border-radius:50%;border:1.5px solid var(--line);background:transparent;cursor:pointer;display:inline-grid;place-items:center;color:var(--accent-ink)}
.dot:hover{border-color:var(--accent)}
.dot.on{background:var(--accent);border-color:var(--accent)}
.dot.future{opacity:.35}
.streak{font-family:var(--mono);font-size:13px;color:var(--muted);white-space:nowrap}
.streak b{color:var(--fg)}
/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .dow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:center;padding:4px 0}
.cal button{aspect-ratio:1/1;max-height:72px;width:100%;border:1px solid var(--line);background:var(--bg);border-radius:5px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-variant-numeric:tabular-nums}
.cal button.out{opacity:.4}
.cal button.today{border-color:var(--accent);color:var(--accent);font-weight:600}
.cal button.sel{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.cal .pips{display:flex;gap:2px;height:5px}
.cal .pips i{width:5px;height:5px;border-radius:50%;background:currentColor}
.split{display:grid;gap:16px;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr)}
@media (max-width:760px){.split{grid-template-columns:minmax(0,1fr)}h2{font-size:30px}}
/* gym */
.days{display:flex;gap:6px;flex-wrap:wrap}
.days button{flex:1 1 90px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:8px 10px;cursor:pointer;min-width:0}
.days button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.days .d{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.days .n{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.setrow{display:grid;grid-template-columns:28px minmax(0,1fr) minmax(0,1fr) 40px;gap:6px;align-items:center;margin-top:6px}
.setrow input[type=number]{width:100%}
.hint{font-family:var(--mono);font-size:12px;color:var(--muted)}
.live{border-color:var(--accent)}
.pill{display:inline-block;font-size:11px;letter-spacing:.1em;text-transform:uppercase;border-radius:20px;padding:2px 9px;background:var(--accent-soft);color:var(--accent);font-weight:600}
.spark{width:100%;height:56px;display:block}
.spark polyline{fill:none;stroke:var(--accent);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.spark circle{fill:var(--accent)}
.up{color:var(--good)}.down{color:var(--bad)}
/* calories */
.ringbox{display:flex;flex-wrap:wrap;gap:20px;align-items:center}
.ring{width:160px;height:160px;flex:none}
.ring .trk{fill:none;stroke:var(--surface2);stroke-width:12}
.ring .val{fill:none;stroke:var(--accent);stroke-width:12;stroke-linecap:round;transform:rotate(-90deg);transform-origin:50% 50%}
.ring.over .val{stroke:var(--warn)}
.ring text{fill:var(--fg);font-family:var(--display);font-weight:800;text-anchor:middle}
.ring .sm{fill:var(--muted);font-family:var(--body);font-weight:400;font-size:11px;letter-spacing:.1em;text-transform:uppercase}
.chart text{fill:var(--muted);font-size:10px;font-family:var(--mono);text-anchor:middle}
.chart .bar1{fill:var(--accent)}.chart .bar1.over{fill:var(--warn)}
.chart .goal{stroke:var(--muted);stroke-dasharray:3 3;stroke-width:1}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--bg);border-radius:20px;padding:4px 11px;font-size:13px;cursor:pointer}
.chip:hover{border-color:var(--accent);color:var(--accent)}
/* timer */
.timer{display:flex;flex-direction:column;align-items:center;gap:16px;padding:12px 0}
.timer .t{font-family:var(--display);font-weight:800;font-size:112px;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:.02em}
@media (max-width:480px){.timer .t{font-size:84px}}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{background:var(--bg);border:0;padding:7px 14px;cursor:pointer;color:var(--muted);font-weight:500}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.seg button+button{border-left:1px solid var(--line)}
/* notes */
.notes{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(min(100%,260px),1fr))}
.note{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.note.pin{border-color:var(--accent)}
.note h4{margin:0;font-size:15px;overflow-wrap:anywhere}
.note p{margin:0;white-space:pre-wrap;overflow-wrap:anywhere;color:var(--muted);font-size:14px}
.sw{display:flex;gap:8px;flex-wrap:wrap}
.sw button{width:34px;height:34px;border-radius:50%;border:2px solid var(--line);cursor:pointer;padding:0}
.sw button[aria-pressed="true"]{border-color:var(--fg)}
.sync{font-family:var(--mono);font-size:12px;color:var(--muted)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:6px;font-size:14px;z-index:40;max-width:90vw}
.focusline{display:flex;flex-direction:column;gap:6px}
.focusline .q{color:var(--muted);font-style:italic}
.focusline input{font-size:17px;padding:10px 12px}
.login{min-height:calc(100vh - 80px);display:grid;place-items:center;padding:24px 0}
.login-card{width:100%;max-width:400px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:28px 24px;display:flex;flex-direction:column;gap:14px}
.login-card .brand{font-size:26px}
.login-card h2{font-size:30px}
.login-form{display:flex;flex-direction:column;gap:6px}
.login-form input{width:100%;font-size:16px;padding:11px 12px}
.login-form .lab2{margin-top:8px}
.login-form .row{margin-top:14px}
.linkbtn{background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer;padding:4px 0;align-self:flex-start;font-size:13px}
.linkbtn:hover{color:var(--accent)}
@media (prefers-reduced-motion:no-preference){.bar>i,.ring .val{transition:all .35s ease}}
</style>
</head>
<body>
<div class="top"><div class="top-in">
  <div class="brandrow"><div class="brand">Command<i>/</i>Centre</div><div class="clock" id="clock">--:--</div></div>
  <nav class="rail" id="rail" aria-label="Modules"></nav>
</div></div>
<div class="wrap"><main id="app"></main></div>
<div id="toast" class="toast" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3/dist/umd/supabase.js"></script>
<script>if(!window.supabase){document.write('<script src="https://unpkg.com/@supabase/supabase-js@2.117.3/dist/umd/supabase.js"><\/script>')}</script>
<script>
/* ===== Supabase data layer =====
   One row per user in public.dashboard_state holds the whole dashboard as JSON.
   Config comes from the two constants below, or (if they still say YOUR_...) from the setup form in Settings,
   which stores them in this browser only. */
(function () {
  var SUPABASE_URL = 'https://ctpgfenlqvzgfhcveovi.supabase.co';
  var SUPABASE_ANON_KEY = 'sb_publishable_qDLp-eHYmQ2rz_3TsAycGw_f3sUta5H'; // public key, safe in the page because row level security protects the data
  var TABLE = 'dashboard_state';

  var LS_STATE = 'command-centre-v2', LS_CFG = 'cc-supabase-config', LS_LAST = 'cc-last-user',
      LS_DIRTY = 'cc-dirty', LS_BACKUP = 'cc-backup-before-sync';

  function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  function lsDel(k) { try { localStorage.removeItem(k); } catch (e) {} }

  function real(v) { return !!v && v.indexOf('YOUR_') !== 0; }
  var fromFile = real(SUPABASE_URL) && real(SUPABASE_ANON_KEY);
  var url = fromFile ? SUPABASE_URL : '', key = fromFile ? SUPABASE_ANON_KEY : '';
  if (!fromFile) {
    try { var c = JSON.parse(lsGet(LS_CFG) || 'null'); if (c && c.url && c.key) { url = c.url; key = c.key; } } catch (e) {}
  }
  var configured = !!(url && key);
  var libOk = !!window.supabase;
  var sb = null;
  if (configured && libOk) {
    try { sb = window.supabase.createClient(url, key, { auth: { persistSession: true, autoRefreshToken: true } }); } catch (e) { sb = null; }
  }
  var session = null, cc = null, busy = false;

  function hhmm() { var d = new Date(); return ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2); }
  function readCache() { try { var s = lsGet(LS_STATE); return s ? JSON.parse(s) : null; } catch (e) { return null; } }
  function writeCache(state) { lsSet(LS_STATE, JSON.stringify(state)); }
  function niceError(e) {
    var m = (e && e.message) || 'Something went wrong.';
    if (/relation .* does not exist|schema cache|PGRST205/i.test(m)) return 'Table missing. Run the SQL setup in Supabase first.';
    if (/permission denied/i.test(m)) return 'Permission denied. Re-run supabase-setup.sql in Supabase (it grants table access).';
    if (/Invalid API key|apikey/i.test(m)) return 'Supabase rejected the API key. Check it in Settings.';
    if (/Failed to fetch|NetworkError|network/i.test(m)) return 'No connection to Supabase.';
    return m;
  }

  async function upload(state) {
    var r = await sb.from(TABLE).upsert({ user_id: session.user.id, data: state, updated_at: new Date().toISOString() });
    if (r.error) throw r.error;
    lsDel(LS_DIRTY);
    lsSet(LS_LAST, session.user.id);
  }

  function typing() { var a = document.activeElement; return !!a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName); }

  async function pull(quiet) {
    if (!sb || !session || !cc || busy) return;
    busy = true;
    if (quiet !== true) cc.setStatus('Syncing…');
    try {
      var r = await sb.from(TABLE).select('data').eq('user_id', session.user.id).maybeSingle();
      if (r.error) throw r.error;
      var remote = r.data && r.data.data;
      var local = cc.getState();
      if (remote && remote.habits) {
        var neverSynced = lsGet(LS_LAST) !== session.user.id;
        if (neverSynced || (remote.updated || 0) > (local.updated || 0)) {
          if (neverSynced) lsSet(LS_BACKUP, JSON.stringify(local)); // keep this device's old data, just in case
          writeCache(remote);
          cc.replaceState(remote);
          lsSet(LS_LAST, session.user.id); lsDel(LS_DIRTY);
          cc.setStatus('Synced ' + hhmm() + (neverSynced ? '. Loaded your cloud data.' : ''));
        } else if ((local.updated || 0) > (remote.updated || 0) || lsGet(LS_DIRTY)) {
          await upload(local);
          cc.setStatus('Synced ' + hhmm());
        } else {
          lsSet(LS_LAST, session.user.id);
          if (quiet !== true) cc.setStatus('Synced ' + hhmm());
        }
      } else {
        await upload(local); // first time for this account: push what is on this device
        cc.setStatus('Synced ' + hhmm());
      }
    } catch (e) {
      cc.setStatus(niceError(e));
    }
    busy = false;
  }

  // Live updates: another device saves, this one updates within a second or two.
  var chan = null;
  function applyRemote(remote) {
    var local = cc.getState();
    if ((remote.updated || 0) <= (local.updated || 0)) return; // our own echo, or older
    if (typing()) { setTimeout(function () { applyRemote(remote); }, 4000); return; }
    writeCache(remote);
    cc.replaceState(remote);
    cc.setStatus('Synced ' + hhmm());
  }
  function subscribe() {
    if (chan || !sb || !session) return;
    try {
      chan = sb.channel('dashboard-' + session.user.id)
        .on('postgres_changes', { event: '*', schema: 'public', table: TABLE, filter: 'user_id=eq.' + session.user.id },
          function (p) { var row = p && p.new; if (row && row.data && row.data.habits) applyRemote(row.data); })
        .subscribe();
    } catch (e) { chan = null; }
  }
  function unsubscribe() { if (chan) { try { sb.removeChannel(chan); } catch (e) {} chan = null; } }

  function setSession(s) {
    var had = session && session.user.id;
    session = s;
    if (!cc) return;
    if (s && had !== s.user.id) { subscribe(); pull().then(function () { cc.refresh(); }); }
    else {
      if (!s) { unsubscribe(); cc.setStatus('Signed out. Saved on this device only.'); }
      cc.refresh();
    }
  }

  window.CCData = {
    load: readCache,

    save: async function (state) {
      writeCache(state);
      if (!sb || !session) return 'Saved on this device';
      try { await upload(state); } catch (e) { lsSet(LS_DIRTY, '1'); throw e; }
      return 'Synced ' + hhmm();
    },

    pull: function () { return pull(); },
    authReady: false,

    start: function (api) {
      cc = api;
      if (!configured) { cc.setStatus('Cloud sync is off'); return; }
      if (!sb) { cc.setStatus('Could not load the Supabase library. Check your connection.'); return; }
      cc.setStatus('Signed out');
      sb.auth.getSession().then(
        function (r) { window.CCData.authReady = true; setSession(r.data.session); },
        function () { window.CCData.authReady = true; setSession(null); });
      // Never await other Supabase calls inside this callback.
      sb.auth.onAuthStateChange(function (_e, s) { setTimeout(function () { setSession(s); }, 0); });
      function wake() { if (!document.hidden && session) { if (lsGet(LS_DIRTY)) { var l = cc.getState(); upload(l).then(function () { cc.setStatus('Synced ' + hhmm()); }, function () {}); } pull(); } }
      document.addEventListener('visibilitychange', wake);
      window.addEventListener('online', wake);
      // Fallback for when live updates are unavailable: check every 30 seconds while the tab is open.
      setInterval(function () { if (session && !document.hidden && !typing()) pull(true); }, 30000);
    },

    needsSetup: function () { return !configured; },
    saveConfig: function (u, k) { lsSet(LS_CFG, JSON.stringify({ url: u, key: k })); },
    clearConfig: fromFile ? undefined : function () { lsDel(LS_CFG); lsDel(LS_LAST); lsDel(LS_DIRTY); },

    auth: sb ? {
      user: function () { return session ? session.user : null; },
      signIn: async function (email, password) {
        var r = await sb.auth.signInWithPassword({ email: email, password: password });
        if (r.error) throw r.error;
      },
      signUp: async function (email, password) {
        var r = await sb.auth.signUp({ email: email, password: password });
        if (r.error) throw r.error;
        return { confirmEmail: !r.data.session };
      },
      signOut: async function () { var r = await sb.auth.signOut(); if (r && r.error) throw r.error; }
    } : undefined
  };
})();

<script>

 home:'<path d="M3 11l9-8 9 8M5 10v10h14V10"/>',

  t:{mode:'focus',remaining:25*60,end:0,running:false}};
/* ===== DATA ADAPTER BOUNDARY =====

}
function paintSync(){var e=$('#syncline');if(e)e.textContent=ui.sync}
function needsSetup(){return !!(D.needsSetup&&D.needsSetup())}

/* ---------- helpers ---------- */
function toast(m){var t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(function(){t.hidden=true},2200)}

function delBtn(kind,id,extra){var k=kind+':'+id+(extra||'');var on=ui.confirm===k;return '<button class="btn sm '+(on?'danger':'ghost')+'" data-act="del" data-kind="'+kind+'" data-id="'+esc(id)+'" data-x="'+esc(extra||'')+'">'+(on?'Confirm delete':'Delete')+'</button>'}

var today=function(){return iso(new Date())};

function habitStreak(h){var d=new Date();if(!h.days[iso(d)])d=addDays(d,-1);var n=0;while(h.days[iso(d)]){n++;d=addDays(d,-1)}return n}
function mealsOn(d){return S.meals[d]||[]}

function e1rm(w,r){return r<=1?w:w*(1+r/30)}

function lastPerf(name){for(var i=S.workouts.length-1;i>=0;i--){var e=S.workouts[i].entries.filter(function(x){return x.name===name})[0];if(e&&e.sets.length){var b=bestSet(e.sets);return b.w+' kg × '+b.r}}return null}
function projPct(p){return p.tasks.length?Math.round(p.tasks.filter(function(t){return t.done}).length/p.tasks.length*100):0}

  }).join('');

    '<button class="btn ghost sm" data-act="week" data-d="-1">‹ Prev</button><button class="btn ghost sm" data-act="week" data-d="0">This week</button><button class="btn ghost sm" data-act="week" data-d="1">Next ›</button><button class="btn sm'+(ui.editH?'':' ghost')+'" data-act="editH">'+(ui.editH?'Done':'Edit habits')+'</button>')+
  '<div class="panel scroll">'+(S.habits.length?'<table class="hab"><thead><tr><th>Habit</th>'+days.map(function(d){return '<th class="'+(iso(d)===td?'today':'')+'">'+DOW[(d.getDay()+6)%7]+'<br>'+d.getDate()+'</th>'}).join('')+'<th></th></tr></thead><tbody>'+rows+'</tbody></table>':'<div class="empty">No habits yet. Add one below.</div>')+'</div>'+

};

V.projects=function(){

    return head(esc(p.name),projPct(p)+'% complete · '+p.tasks.filter(function(t){return t.done}).length+' of '+p.tasks.length+' tasks','<button class="btn ghost sm" data-act="projback">‹ All projects</button>'+delBtn('project',p.id))+

    '<form data-form="task" class="form" style="margin-top:14px"><input id="tn" type="text" maxlength="120" placeholder="Add a task" required aria-label="New task"><button class="btn" type="submit">Add</button></form></div>';

V['gym-stats']=function(){
  var by={};
  S.workouts.forEach(function(w){w.entries.forEach(function(e){if(!e.sets.length)return;var b=bestSet(e.sets);(by[e.name]=by[e.name]||[]).push({d:w.date,w:b.w,r:b.r,v:e1rm(b.w,b.r)})})});
  var names=Object.keys(by).sort();
  var wkStart=iso(mondayOf(new Date()));
  var vol=0;S.workouts.forEach(function(w){if(w.date>=wkStart)w.entries.forEach(function(e){e.sets.forEach(function(s){vol+=s.w*s.r})})});
  var cards=names.map(function(n){
    var a=by[n],f=a[0],l=a[a.length-1],ch=f.v?((l.v-f.v)/f.v*100):0;
    var mx=Math.max.apply(null,a.map(function(x){return x.v})),mn=Math.min.apply(null,a.map(function(x){return x.v})),rg=(mx-mn)||1;
    var pts=a.map(function(x,i){return (a.length===1?150:8+i*(284/(a.length-1)))+','+(48-(x.v-mn)/rg*40)});
    var lastPt=pts[pts.length-1].split(',');
    return '<div class="panel"><div class="row" style="justify-content:space-between"><h3 style="margin:0;font-size:17px;text-transform:none;letter-spacing:.01em;font-family:var(--body);font-weight:600">'+esc(n)+'</h3><span class="mono '+(ch>=0?'up':'down')+'">'+(ch>=0?'+':'')+ch.toFixed(1)+'%</span></div>'+
    '<svg class="spark" viewBox="0 0 300 56" preserveAspectRatio="none" role="img" aria-label="Estimated 1RM trend"><polyline points="'+pts.join(' ')+'"/><circle cx="'+lastPt[0]+'" cy="'+lastPt[1]+'" r="3.5"/></svg>'+
    '<div class="row mono" style="justify-content:space-between;font-size:13px"><span>Last: '+l.w+' kg × '+l.r+'</span><span>Est. 1RM '+l.v.toFixed(1)+' kg</span></div><div class="hint" style="margin-top:4px">'+a.length+' session'+(a.length===1?'':'s')+' · first 1RM '+f.v.toFixed(1)+' kg</div></div>'}).join('');
  var recent=S.workouts.slice(-5).reverse().map(function(w){return '<li><span class="mono muted">'+w.date+'</span><span class="grow">'+esc(w.name||'Workout')+'</span><span class="hint">'+w.entries.reduce(function(a,e){return a+e.sets.length},0)+' sets</span>'+delBtn('workout',w.id)+'</li>'}).join('');
  return head('Gym stats &amp; progression','Estimated 1RM uses the Epley formula: weight × (1 + reps ÷ 30).')+
  '<div class="grid"><div class="tile" style="cursor:default"><span class="lab">Sessions logged</span><span class="big">'+S.workouts.length+'</span></div><div class="tile" style="cursor:default"><span class="lab">Volume this week</span><span class="big">'+fmtN(vol)+'<span style="font-size:18px"> kg</span></span></div></div>'+
  (names.length?'<div class="grid">'+cards+'</div><div class="panel"><h3>Recent sessions</h3><ul class="list">'+recent+'</ul></div>':'<div class="empty">No workouts logged yet. Start a live session from Gym Plan and your lifts appear here.</div>');
};

V.calories=function(){
  var d=ui.calDate,ms=mealsOn(d),kc=kcalOn(d),pr=ms.reduce(function(a,m){return a+(m.p||0)},0),rem=S.goal-kc,over=kc>S.goal;
  var C=2*Math.PI*54,frac=Math.min(kc/S.goal,1);
  var ring='<svg class="ring'+(over?' over':'')+'" viewBox="0 0 140 140" role="img" aria-label="'+kc+' of '+S.goal+' kcal"><circle class="trk" cx="70" cy="70" r="54"/><circle class="val" cx="70" cy="70" r="54" stroke-dasharray="'+C.toFixed(1)+'" stroke-dashoffset="'+(C*(1-frac)).toFixed(1)+'"/><text x="70" y="76" font-size="34">'+fmtN(Math.abs(rem))+'</text><text class="sm" x="70" y="94">'+(over?'kcal over':'kcal left')+'</text></svg>';
  var days=[];for(var i=6;i>=0;i--)days.push(addDays(parse(d),-i));
  var mx=Math.max(S.goal,Math.max.apply(null,days.map(function(x){return kcalOn(iso(x))})))*1.1;
  var bars=days.map(function(x,i){var v=kcalOn(iso(x)),h=v/mx*70;return '<rect class="bar1'+(v>S.goal?' over':'')+'" x="'+(i*40+10)+'" y="'+(80-h)+'" width="24" height="'+h+'" rx="2"/><text x="'+(i*40+22)+'" y="94">'+DOW[(x.getDay()+6)%7][0]+'</text>'}).join('');
  var gy=80-S.goal/mx*70;
  var seen={},recent=[];for(var k in S.meals){S.meals[k].forEach(function(m){if(!seen[m.name.toLowerCase()]){seen[m.name.toLowerCase()]=1;recent.push(m)}})}
  recent=recent.slice(-8).reverse();
  return head('Calorie tracker',parse(d).toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long'}),'<button class="btn ghost sm" data-act="calday" data-d="-1">‹</button><button class="btn ghost sm" data-act="calday" data-d="0">Today</button><button class="btn ghost sm" data-act="calday" data-d="1">›</button>')+
  '<div class="split"><div class="panel"><div class="ringbox">'+ring+'<div style="flex:1 1 160px;min-width:0"><div class="mono">Eaten <b>'+fmtN(kc)+'</b> kcal</div><div class="mono">Goal <b>'+fmtN(S.goal)+'</b> kcal</div><div class="mono">Protein <b>'+Math.round(pr)+'</b> g</div>'+
  '<form data-form="goal" class="form" style="margin-top:10px"><input id="gl" type="number" min="500" max="10000" step="50" value="'+S.goal+'" aria-label="Daily goal"><button class="btn ghost sm" type="submit">Set goal</button></form></div></div>'+
  '<svg class="chart" viewBox="0 0 290 100" style="width:100%;margin-top:14px" role="img" aria-label="Last 7 days"><line class="goal" x1="0" x2="290" y1="'+gy+'" y2="'+gy+'"/>'+bars+'</svg><div class="hint">Last 7 days. Dashed line is your goal.</div></div>'+
  '<div class="panel"><h3>Meals</h3>'+(ms.length?'<ul class="list">'+ms.map(function(m){return '<li><span class="grow">'+esc(m.name)+(m.p?' <span class="hint">'+m.p+' g protein</span>':'')+'</span><span class="mono">'+fmtN(m.kcal)+'</span>'+delBtn('meal',m.id)+'</li>'}).join('')+'</ul>':'<div class="empty">Nothing logged for this day.</div>')+
  '<form data-form="meal" class="form" style="margin-top:14px"><input id="mn" type="text" maxlength="60" placeholder="Meal" required aria-label="Meal name"><input id="mk" type="number" min="0" max="10000" placeholder="kcal" required aria-label="Calories"><input id="mp" type="number" min="0" max="500" placeholder="protein g" aria-label="Protein"><button class="btn" type="submit">Log</button></form>'+
  (recent.length?'<div class="lab2" style="margin:14px 0 6px">Log again</div><div class="chips">'+recent.map(function(m){return '<button class="chip" data-act="relog" data-n="'+esc(m.name)+'" data-k="'+m.kcal+'" data-p="'+(m.p||0)+'">'+esc(m.name)+' · '+m.kcal+'</button>'}).join('')+'</div>':'')+'</div></div>';
};

 nav:function(el){location.hash=el.dataset.v==='home'?'':el.dataset.v;if(!location.hash){setView('home')}},

 startlive:function(){
  var rd=S.routines[ui.planDay];if(!rd.ex.length||S.live)return;
  S.live={name:rd.name||DOW[ui.planDay],started:Date.now(),entries:rd.ex.map(function(e){var lp=null;for(var i=S.workouts.length-1;i>=0&&!lp;i--){lp=S.workouts[i].entries.filter(function(x){return x.name===e.name})[0]}var sets=[];for(var k=0;k<e.sets;k++){var s=lp&&lp.sets[k]?lp.sets[k]:null;sets.push({w:s?s.w:'',r:s?s.r:e.reps,done:false})}return {name:e.name,sets:sets}})};
  save();render();
 },
 addset:function(el){var e=S.live.entries[+el.dataset.ei];var l=e.sets[e.sets.length-1]||{w:'',r:8};e.sets.push({w:l.w,r:l.r,done:false});save();render()},

 },
 calday:function(el){var d=+el.dataset.d;ui.calDate=d===0?today():iso(addDays(parse(ui.calDate),d));render()},

 treset:function(){var t=ui.t;t.running=false;t.remaining=S.focusCfg[t.mode]*60;render()},
 theme:function(el){S.theme=el.dataset.t;applyTheme();save();render()},
 hue:function(el){S.hue=+el.dataset.h;applyTheme();save();render()},
 export:function(){
  var txt=JSON.stringify(S,null,2);ui.exportText=txt;render();
  try{var bl=new Blob([txt],{type:'application/json'}),u=URL.createObjectURL(bl),a=document.createElement('a');a.href=u;a.download='command-centre-backup-'+today()+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(u)},1000)}catch(e){}
 },
 install:async function(){if(!deferredInstall)return;deferredInstall.prompt();try{await deferredInstall.userChoice}catch(e){}deferredInstall=null;render()},
 skiplogin:function(){try{localStorage.setItem('cc-skip-login','1')}catch(e){}render()},
 clearcfg:function(){if(!asked('clearcfg'))return;D.clearConfig();location.reload()},
 syncnow:function(){if(D.pull)D.pull()},
 signout:async function(){try{await D.auth.signOut();try{localStorage.removeItem('cc-skip-login')}catch(e){}toast('Signed out.');render()}catch(e){toast('Could not sign out.')}},
 importtoggle:function(){ui.importOpen=!ui.importOpen;render()},
 doimport:async function(){
  var txt=($('#impt')||{}).value||'';
  var f=$('#impfile');
  try{
    if(!txt.trim()&&f&&f.files[0])txt=await f.files[0].text();
    var o=JSON.parse(txt);if(!o||!o.habits||!o.routines)throw new Error('bad');
    S=normalise(o);ui.importOpen=false;applyTheme();save();toast('Data imported.');render();
  }catch(e){toast('That file is not a valid backup.')}
 },
 reset:function(){if(ui.confirm==='reset'){ui.confirm=null;S=defaults();ui.proj=null;applyTheme();save();toast('Everything was reset.');render()}else{ui.confirm='reset';render()}},
 del:function(el){
  var kind=el.dataset.kind,id=el.dataset.id,key=kind+':'+id+(el.dataset.x||'');
  if(!asked(key))return;
  if(kind==='habit')S.habits=S.habits.filter(function(x){return x.id!==id});
  if(kind==='event')S.events=S.events.filter(function(x){return x.id!==id});
  if(kind==='project'){S.projects=S.projects.filter(function(x){return x.id!==id});ui.proj=null}
  if(kind==='task'){var p=S.projects.filter(function(x){return x.id===ui.proj})[0];p.tasks=p.tasks.filter(function(x){return x.id!==id})}
  if(kind==='workout')S.workouts=S.workouts.filter(function(x){return x.id!==id});
  if(kind==='meal')S.meals[ui.calDate]=mealsOn(ui.calDate).filter(function(x){return x.id!==id});
  if(kind==='book')S.books=S.books.filter(function(x){return x.id!==id});
  if(kind==='note')S.notes=S.notes.filter(function(x){return x.id!==id});
  save();render();
 }
};
var F={
 auth:async function(f,e){
  var A=D.auth;if(!A)return;
  var mode=(e.submitter&&e.submitter.dataset.mode)||'in',em=$('#ae').value.trim(),pw=$('#ap').value;
  ui.sync=mode==='up'?'Creating account…':'Signing in…';paintSync();
  try{
    var r=await (mode==='up'?A.signUp(em,pw):A.signIn(em,pw));
    if(r&&r.confirmEmail){ui.sync='Check your email to confirm your account, then sign in.';paintSync();toast('Confirmation email sent.')}
  }catch(err){ui.sync=(err&&err.message)||'Could not sign in.';paintSync()}
 },
 setup:function(){var u=$('#su').value.trim(),k=$('#sk').value.trim();var p;try{p=new URL(u);if(p.protocol!=='https:')throw 0}catch(e){toast('Enter the full https:// project URL.');return}D.saveConfig(p.origin,k);location.reload()},
 focus:function(f){var v=$('#fi').value.trim();if(v)S.todayFocus[today()]=v;else delete S.todayFocus[today()];save();toast('Focus saved.')},
 habit:function(){var v=$('#hn').value.trim();if(!v)return;S.habits.push({id:uid(),name:v,days:{}});save();render()},
 event:function(){var v=$('#ex').value.trim();if(!v)return;S.events.push({id:uid(),date:ui.sel,time:$('#et').value,title:v});save();render()},
 project:function(){var v=$('#pn').value.trim();if(!v)return;var p={id:uid(),name:v,tasks:[]};S.projects.push(p);ui.proj=p.id;save();render()},
 task:function(){var v=$('#tn').value.trim();if(!v)return;S.projects.filter(function(x){return x.id===ui.proj})[0].tasks.push({id:uid(),text:v,done:false});save();render()},
 addex:function(){
  var s=$('#exsel').value,name=s==='__custom'?$('#excustom').value.trim():s;if(!name)return;
  S.routines[ui.planDay].ex.push({id:uid(),name:name,sets:3,reps:8});save();render();
 },
 goal:function(){var v=num($('#gl').value);if(v>=500){S.goal=Math.round(v);save();render()}},
 meal:function(){var n=$('#mn').value.trim(),k=num($('#mk').value);if(!n||k<0)return;(S.meals[ui.calDate]=S.meals[ui.calDate]||[]).push({id:uid(),name:n,kcal:Math.round(k),p:num($('#mp').value)});save();render()},
 book:function(){var t=$('#bt').value.trim(),p=Math.round(num($('#bp').value));if(!t||p<1)return;S.books.push({id:uid(),title:t,author:$('#ba').value.trim(),pages:p,cur:0});save();render()},
 note:function(){
  var b=$('#nb').value.trim(),t=$('#nt').value.trim();if(!b)return;
  if(ui.editNote){var n=S.notes.filter(function(x){return x.id===ui.editNote})[0];n.title=t;n.body=b;ui.editNote=null}
  else S.notes.push({id:uid(),title:t,body:b,pin:false,t:Date.now()});
  save();render();
 },
 tcfg:function(){S.focusCfg={focus:clamp($('#cf').value,1,180),short:clamp($('#cs').value,1,60),long:clamp($('#cl').value,1,90)};if(!ui.t.running)ui.t.remaining=S.focusCfg[ui.t.mode]*60;save();render();toast('Timer lengths saved.')}
};
function clamp(v,a,b){v=Math.round(num(v));return Math.max(a,Math.min(b,v||a))}
var C={
 hname:function(el){var h=S.habits.filter(function(x){return x.id===el.dataset.id})[0];if(el.value.trim())h.name=el.value.trim();save()},
 task:function(el){var p=S.projects.filter(function(x){return x.id===ui.proj})[0];p.tasks.filter(function(t){return t.id===el.dataset.id})[0].done=el.checked;save();render()},
 rname:function(el){S.routines[ui.planDay].name=el.value.trim();save();var n=$('.days [aria-pressed="true"] .n');if(n)n.textContent=el.value.trim()||'Rest'},
 exsets:function(el){S.routines[ui.planDay].ex.filter(function(e){return e.id===el.dataset.id})[0].sets=clamp(el.value,1,20);save()},
 exreps:function(el){S.routines[ui.planDay].ex.filter(function(e){return e.id===el.dataset.id})[0].reps=clamp(el.value,1,100);save()},
 lw:function(el){S.live.entries[+el.dataset.ei].sets[+el.dataset.si].w=el.value===''?'':num(el.value);save()},
 lr:function(el){S.live.entries[+el.dataset.ei].sets[+el.dataset.si].r=el.value===''?'':num(el.value);save()},
 ld:function(el){S.live.entries[+el.dataset.ei].sets[+el.dataset.si].done=el.checked;save()},
 bookpg:function(el){var b=S.books.filter(function(x){return x.id===el.dataset.id})[0];b.cur=Math.max(0,Math.min(b.pages,Math.round(num(el.value))));save();render()}
};

/* ---------- timer ---------- */
function setMode(m){var t=ui.t;t.mode=m;t.running=false;t.remaining=S.focusCfg[m]*60;render()}
function paintTimer(){var t=ui.t,e=$('#tdisp');var s=t.running?(t.end-Date.now())/1000:t.remaining;if(e)e.textContent=fmtT(s);document.title=t.running?fmtT(s)+' · Command Centre':'Command Centre'}
var audio=null;
function beep(n){try{audio=audio||new (window.AudioContext||window.webkitAudioContext)();var o=audio.createOscillator(),g=audio.createGain();o.frequency.value=n?880:440;g.gain.value=n?.15:.0001;o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+(n?.5:.01))}catch(e){}}
setInterval(function(){
  var t=ui.t;
  if(t.running){
    var left=(t.end-Date.now())/1000;
    if(left<=0){t.running=false;t.remaining=0;if(t.mode==='focus'){S.sessions[today()]=(S.sessions[today()]||0)+1;save()}beep(1);toast(t.mode==='focus'?'Focus session complete.':'Break is over.');if(ui.view==='focus')render();else paintTimer();document.title='Command Centre'}
    else paintTimer();
  }
},250);
function tick(){var d=new Date();var e=$('#clock');if(e)e.textContent=pad(d.getHours())+':'+pad(d.getMinutes())+':'+pad(d.getSeconds())}
tick();setInterval(tick,1000);

/* ---------- events ---------- */
document.addEventListener('click',function(e){
  var el=e.target.closest('[data-act]');
  if(!el){if(ui.confirm){ui.confirm=null;var inForm=e.target.closest('input,textarea,select');if(!inForm)render()}return}
  var f=A[el.dataset.act];if(f)f(el,e);
});
document.addEventListener('submit',function(e){
  var f=e.target.closest('[data-form]');if(!f)return;e.preventDefault();var fn=F[f.dataset.form];if(fn)fn(f,e);
});
document.addEventListener('change',function(e){
  var el=e.target;
  if(el.id==='exsel'){var c=$('#excustom');if(c)c.hidden=el.value!=='__custom';if(c&&!c.hidden)c.focus();return}
  if(el.dataset&&el.dataset.chg&&el.dataset.chg!=='nsearch'){var fn=C[el.dataset.chg];if(fn)fn(el)}
});
document.addEventListener('input',function(e){
  var el=e.target;
  if(el.dataset&&el.dataset.chg==='nsearch'){ui.noteQ=el.value;var pos=el.selectionStart;render();var n=$('#ns');if(n){n.focus();n.setSelectionRange(pos,pos)}}
});
function setView(v){if(!V[v])v='home';ui.view=v;ui.confirm=null;render();window.scrollTo(0,0)}
window.addEventListener('hashchange',function(){setView(location.hash.replace('#','')||'home')});

/* ---------- boot ---------- */
(async function(){
  try{var l=await D.load();if(l)S=normalise(l)}catch(e){}
  applyTheme();
  var h=location.hash.replace('#','');ui.view=V[h]?h:'home';
  ui.t.remaining=S.focusCfg.focus*60;
  render();
  if(D.start)D.start(window.CC);
})();
})();
</script>
<script>if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})})}</script>
</body>
</html>
