<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0d1017">
<meta name="apple-mobile-web-app-title" content="Command">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" href="icons/icon-32.png">
<title>Command Centre</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{color-scheme:light;padding-block:env(safe-area-inset-top,0px) env(safe-area-inset-bottom,0px)}
body{margin:0}
[hidden]{display:none!important}
/* Layout concept: a flight-deck style personal ops board. Sticky module rail on top, a home overview of live tiles, and one focused panel per module. */
:root{
  --ah:235;
  --bg:#eceff5; --surface:#f8f9fc; --surface2:#e2e6f0; --line:#cfd5e4;
  --fg:#14182a; --muted:#566079;
  --accent:hsl(var(--ah) 62% 44%); --accent-soft:hsl(var(--ah) 70% 92%); --accent-ink:#ffffff;
  --good:#14804a; --warn:#a96400; --bad:#b3261e;
  --display:'Big Shoulders Display','Arial Narrow',Impact,sans-serif;
  --body:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0d1017; --surface:#151a24; --surface2:#1d2331; --line:#272f42;
  --fg:#e8ebf3; --muted:#8f98b0;
  --accent:hsl(var(--ah) 82% 72%); --accent-soft:hsl(var(--ah) 40% 20%); --accent-ink:#0d1017;
  --good:#4cc38a; --warn:#e0a040; --bad:#ff7a70; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1017; --surface:#151a24; --surface2:#1d2331; --line:#272f42;
  --fg:#e8ebf3; --muted:#8f98b0;
  --accent:hsl(var(--ah) 82% 72%); --accent-soft:hsl(var(--ah) 40% 20%); --accent-ink:#0d1017;
  --good:#4cc38a; --warn:#e0a040; --bad:#ff7a70; color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.5;
  padding-block:0 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;font-family:var(--display);font-weight:800;letter-spacing:.02em;text-wrap:balance;line-height:1.05}
h2{font-size:34px;text-transform:uppercase}
h3{font-size:20px;text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.wrap{max-width:1080px;margin:0 auto}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:21;background:var(--bg);
  margin-inline:calc(-1*max(16px,env(safe-area-inset-left,0px))) calc(-1*max(16px,env(safe-area-inset-right,0px)));
  padding:10px max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px))}
.top-in{max-width:1080px;margin:0 auto}
.rl .short{display:none}
.railbar{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--topH,52px));z-index:20;background:var(--bg);border-bottom:1px solid var(--line);transition:transform .22s ease;
  margin-inline:calc(-1*max(16px,env(safe-area-inset-left,0px))) calc(-1*max(16px,env(safe-area-inset-right,0px)));
  padding:6px max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px))}
@media (prefers-reduced-motion:reduce){.railbar{transition:none}}
.brandrow{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.brand{font-family:var(--display);font-weight:800;font-size:22px;letter-spacing:.14em;text-transform:uppercase}
.brand i{font-style:normal;color:var(--accent)}
.clock{font-family:var(--mono);font-size:15px;color:var(--muted);font-variant-numeric:tabular-nums}
.brandrow{flex-wrap:wrap}
.top-right{display:flex;align-items:center;gap:14px;justify-content:flex-end}
.minit{display:flex;align-items:center;gap:1px;border:1px solid var(--line);border-radius:6px;background:var(--surface);padding:2px}
.minit button{background:none;border:0;color:var(--muted);width:28px;height:28px;border-radius:4px;cursor:pointer;display:grid;place-items:center;padding:0}
.minit button:hover{color:var(--accent);background:var(--accent-soft)}
.minit .mt{font-family:var(--mono);font-size:14px;min-width:54px;text-align:center;font-variant-numeric:tabular-nums;color:var(--fg)}
.minit.run .mt{color:var(--accent)}
.minit.done .mt{color:var(--warn)}
@media (max-width:520px){
  .top{padding-top:6px}
  .brandrow{flex-wrap:nowrap;align-items:center;gap:8px}
  .brand{font-size:15px;letter-spacing:.07em;white-space:nowrap;min-width:0}
  .top-right{gap:8px;flex:none}
  .minit button{width:26px;height:26px}
  .minit .mt{font-size:13px;min-width:46px}
  .clock{font-size:13px}.clock .sec{display:none}
  .railbar{padding-top:0}
  .railbar .rail{display:grid;grid-template-columns:repeat(var(--cols,7),minmax(0,1fr));gap:2px;overflow:visible;margin-top:0;padding:4px 0 6px}
  .railbar .rail button{flex-direction:column;justify-content:center;gap:2px;padding:5px 1px 4px;font-size:10px;letter-spacing:-.01em;border-bottom:0;border-radius:8px;min-width:0;overflow:hidden}
  .railbar .rail button .ico{width:18px;height:18px}
  .railbar .rail button .rl{display:block;max-width:100%;overflow:hidden;text-overflow:ellipsis}
  .rl .full{display:none}.rl .short{display:inline}
  .railbar .rail button[aria-current="page"]{background:var(--accent-soft,color-mix(in srgb,var(--accent) 12%,transparent));color:var(--accent)}
  .railbar.hide{transform:translateY(-105%)}
}
@media (max-width:345px){.railbar .rail{grid-template-columns:repeat(var(--cols3,5),minmax(0,1fr))}}
@media (max-width:345px){.brandrow{flex-wrap:wrap}.top-right{width:100%;justify-content:space-between}}
@media (max-width:360px){.brand{font-size:12.5px;letter-spacing:.03em}.top-right{gap:5px}.minit .mt{min-width:40px;font-size:12px}.minit button{width:23px;height:23px}}
.rail{display:flex;flex-wrap:wrap;gap:0 2px;scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.rail button{flex:none;display:flex;align-items:center;gap:6px;background:none;border:0;border-bottom:2px solid transparent;padding:9px 11px;color:var(--muted);cursor:pointer;font-size:13px;font-weight:500;white-space:nowrap}
.rail button:hover{color:var(--fg)}
.rail button[aria-current="page"]{color:var(--fg);border-bottom-color:var(--accent)}
.ico{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
main{padding-top:24px;display:flex;flex-direction:column;gap:20px}
.head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:10px 16px}
.head p{margin:4px 0 0;color:var(--muted)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr))}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:16px;min-width:0}
.panel>h3{margin-bottom:12px}
.tile{display:flex;flex-direction:column;gap:6px;text-align:left;cursor:pointer;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:14px 16px;min-width:0}
.tile:hover{border-color:var(--accent)}
.tile .lab{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:6px}
.tile .big{font-family:var(--display);font-weight:800;font-size:38px;line-height:1;font-variant-numeric:tabular-nums}
.tile .sub{color:var(--muted);font-size:13px;overflow-wrap:anywhere}
.bar{height:6px;border-radius:3px;background:var(--surface2);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:3px}
.bar.over>i{background:var(--warn)}
.btn{background:var(--accent);color:var(--accent-ink);border:1px solid var(--accent);border-radius:5px;padding:8px 14px;cursor:pointer;font-weight:600;font-size:14px}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;color:var(--fg);border-color:var(--line)}
.btn.ghost:hover{border-color:var(--accent);color:var(--accent)}
.btn.danger{background:transparent;color:var(--bad);border-color:var(--bad)}
.btn.sm{padding:4px 10px;font-size:13px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input,select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:5px;padding:8px 10px;min-width:0;max-width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}
textarea{width:100%;min-height:90px;resize:vertical}
input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent);padding:0}
.form{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.form input[type=text],.form input:not([type]){flex:1 1 160px}
.form input[type=number]{width:96px}
.lab2{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.empty{color:var(--muted);padding:18px 4px;text-align:center;border:1px dashed var(--line);border-radius:6px}
.list{display:flex;flex-direction:column;gap:0;margin:0;padding:0;list-style:none}
.list>li{display:flex;align-items:center;gap:10px;padding:10px 2px;border-bottom:1px solid var(--line);min-width:0}
.list>li:last-child{border-bottom:0}
.list .grow{flex:1;min-width:0;overflow-wrap:anywhere}
.done{text-decoration:line-through;color:var(--muted)}
.scroll{overflow-x:auto}
/* habits */
table.hab{border-collapse:collapse;width:100%;min-width:560px}
.hab th{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:500;padding:6px 4px;text-align:center}
.hab th:first-child,.hab td:first-child{text-align:left}
.hab td{padding:6px 4px;border-top:1px solid var(--line);text-align:center}
.hab th.today{color:var(--accent)}
.dot{width:30px;height:30px;border-radius:50%;border:1.5px solid var(--line);background:transparent;cursor:pointer;display:inline-grid;place-items:center;color:var(--accent-ink)}
.dot:hover{border-color:var(--accent)}
.dot.on{background:var(--accent);border-color:var(--accent)}
.dot.future{opacity:.35}
.hab td:first-child .row{flex-wrap:wrap;gap:6px}.hab td:first-child input[type=text]{width:150px;min-width:0}.hab td:first-child select{max-width:150px}
.dot.rest{border-style:dashed;opacity:.55}.restmark{color:var(--muted);font-size:18px;line-height:1}
.dot.rest.on{opacity:1}
.streak{font-family:var(--mono);font-size:13px;color:var(--muted);white-space:nowrap}
.streak b{color:var(--fg)}
/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .dow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:center;padding:4px 0}
.cal button{aspect-ratio:1/1;max-height:72px;width:100%;border:1px solid var(--line);background:var(--bg);border-radius:5px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-variant-numeric:tabular-nums}
.cal button.out{opacity:.4}
.cal button.today{border-color:var(--accent);color:var(--accent);font-weight:600}
.cal button.sel{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.cal .pips{display:flex;gap:2px;height:5px}
.cal .pips i{width:5px;height:5px;border-radius:50%;background:currentColor}
.split{display:grid;gap:16px;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr)}
@media (max-width:760px){.split{grid-template-columns:minmax(0,1fr)}h2{font-size:30px}}
/* gym */
.days{display:flex;gap:6px;flex-wrap:wrap}
.days button{flex:1 1 90px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:8px 10px;cursor:pointer;min-width:0}
.days button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.days .d{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.days .n{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tag{display:inline-block;font:600 11px var(--mono);letter-spacing:.04em;padding:2px 7px;border-radius:10px;border:1px solid var(--line);vertical-align:middle}
.rtot{grid-template-columns:repeat(3,minmax(0,1fr))!important;gap:8px!important}
.rtot .big{font-size:26px!important}
.pbgrid{grid-template-columns:repeat(2,minmax(0,1fr))!important}
@media (min-width:760px){.pbgrid{grid-template-columns:repeat(3,minmax(0,1fr))!important}}
@media (max-width:520px){.rtot .big span{font-size:13px!important}.rtot .tile,.pbgrid .tile{padding:10px}.pbgrid .big{font-size:24px!important}}
.rbars{display:flex;align-items:flex-end;gap:6px;height:130px;padding-top:16px}
.rb{flex:1;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:2px;min-width:0}
.rbar{width:100%;max-width:34px;background:var(--line);border-radius:4px 4px 0 0;display:block;min-height:1px}
.rbar.cur{background:var(--accent)}
.rv{font:11px var(--mono);color:var(--muted)}
.rl{font:10px var(--mono);color:var(--muted)}
.rrow{display:flex;align-items:flex-start;gap:8px}
.rrow .rd{width:48px;flex:none}
.pbtag{background:var(--surface);border:1px solid var(--line);color:var(--muted)}
.pbtag.cur{border-color:var(--accent);color:var(--accent)}
.exctl{display:contents}
.figs{display:flex;justify-content:center;gap:12px;margin:8px 0;background:#2a292e;border-radius:12px;padding:14px 8px 8px}
.figs figure{margin:0;text-align:center}
.figs figcaption{font:11px var(--mono);color:#9a9aa3;text-transform:uppercase;letter-spacing:.08em}
.fig{width:min(180px,44vw);height:auto;display:block}
.fig .head{fill:#444349}
.fig .body{fill:#49484d}
.fig .m{fill:#646466;cursor:pointer}
.fig .m.sel{stroke:#fff;stroke-width:3}
.musinfo{display:flex;flex-direction:column;gap:2px;align-items:center;text-align:center;margin:8px 0 0;padding:8px;border-radius:8px;background:var(--bg)}
.musinfo b{font-size:16px}
.musinfo span{color:var(--muted);font-size:13px}
.mtbl{overflow-x:auto}
.mtbl table{width:100%;border-collapse:collapse;font-size:13px}
.mtbl th,.mtbl td{padding:3px 4px;text-align:center;border-bottom:1px solid var(--line)}
.mtbl td:first-child{text-align:left}
.mtbl td.sel{background:var(--accent-soft)}
.mtbl .dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--accent)}
.mday{border:1px solid var(--line);background:var(--bg);border-radius:6px;width:28px;height:26px;cursor:pointer;color:var(--fg)}
.mday.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
@media (max-width:520px){
 .exli .grow{flex:1 1 0;min-width:0;overflow-wrap:anywhere}
 .exli .exctl{display:flex;align-items:center;gap:8px;flex:1 0 100%;padding-left:2px}
 .exli .exctl .btn:first-of-type{margin-left:auto}
 .lvhead{flex-direction:column;align-items:flex-start!important;gap:6px}
 .lvhead>strong{width:100%;font-size:16px}
 .lvhead>.row{width:100%;flex-wrap:wrap}
}
.setrow{display:grid;grid-template-columns:28px minmax(0,1fr) minmax(0,1fr) 40px;gap:6px;align-items:center;margin-top:6px}
.setrow input[type=number]{width:100%}
.hint{font-family:var(--mono);font-size:12px;color:var(--muted)}
.live{border-color:var(--accent)}
.pill{display:inline-block;font-size:11px;letter-spacing:.1em;text-transform:uppercase;border-radius:20px;padding:2px 9px;background:var(--accent-soft);color:var(--accent);font-weight:600}
.spark{width:100%;height:56px;display:block}
.spark polyline{fill:none;stroke:var(--accent);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.spark circle{fill:var(--accent)}
.wl{fill:none;stroke:var(--accent);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}.wd{fill:var(--muted);opacity:.75}
.wp{fill:var(--accent);stroke:var(--surface);stroke-width:1.5}
.prstar{color:var(--accent);font-weight:700;text-align:center}
.sug{margin-top:2px;color:var(--fg);display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-family:var(--body);font-size:13px}
.restbar{position:sticky;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:6;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--accent);border-radius:8px;padding:8px 12px;margin-top:16px;box-shadow:0 6px 18px rgba(0,0,0,.18)}
.restbar[hidden]{display:none}
.restbar #restt{font-size:24px;color:var(--accent)}
.up{color:var(--good)}.down{color:var(--bad)}
/* calories */
.ringbox{display:flex;flex-wrap:wrap;gap:20px;align-items:center}
.ring{width:160px;height:160px;flex:none}
.ring .trk{fill:none;stroke:var(--surface2);stroke-width:12}
.ring .val{fill:none;stroke:var(--accent);stroke-width:12;stroke-linecap:round;transform:rotate(-90deg);transform-origin:50% 50%}
.ring.over .val{stroke:var(--warn)}
.ring text{fill:var(--fg);font-family:var(--display);font-weight:800;text-anchor:middle}
.ring .sm{fill:var(--muted);font-family:var(--body);font-weight:400;font-size:11px;letter-spacing:.1em;text-transform:uppercase}
.chart text{fill:var(--muted);font-size:10px;font-family:var(--mono);text-anchor:middle}
.chart .bar1{fill:var(--accent)}.chart .bar1.over{fill:var(--warn)}
.chart .goal{stroke:var(--muted);stroke-dasharray:3 3;stroke-width:1}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--bg);border-radius:20px;padding:4px 11px;font-size:13px;cursor:pointer}
.chip:hover{border-color:var(--accent);color:var(--accent)}
/* timer */
.timer{display:flex;flex-direction:column;align-items:center;gap:16px;padding:12px 0}
.timer .t{font-family:var(--display);font-weight:800;font-size:112px;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:.02em}
@media (max-width:480px){.timer .t{font-size:84px}}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{background:var(--bg);border:0;padding:7px 14px;cursor:pointer;color:var(--muted);font-weight:500}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.seg button+button{border-left:1px solid var(--line)}
/* notes */
.notes{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(min(100%,260px),1fr))}
.note{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.note.pin{border-color:var(--accent)}
.note h4{margin:0;font-size:15px;overflow-wrap:anywhere}
.note p{margin:0;white-space:pre-wrap;overflow-wrap:anywhere;color:var(--muted);font-size:14px}
.sw{display:flex;gap:8px;flex-wrap:wrap}
.sw button{width:34px;height:34px;border-radius:50%;border:2px solid var(--line);cursor:pointer;padding:0}
.sw button[aria-pressed="true"]{border-color:var(--fg)}
.sync{font-family:var(--mono);font-size:12px;color:var(--muted)}
.grip{flex:none;background:none;border:0;color:var(--muted);cursor:grab;font-size:18px;line-height:1;padding:6px 4px;touch-action:none;user-select:none;border-radius:4px}
.grip:hover,.grip:focus-visible{color:var(--accent)}
[data-row].dragging{position:relative;z-index:8;background:var(--surface);box-shadow:0 8px 22px rgba(0,0,0,.22);cursor:grabbing}
.chipset{display:inline-flex}.chipset .chip:first-child{border-radius:20px 0 0 20px;border-right:0}.chipset .chip.x{border-radius:0 20px 20px 0;padding:4px 9px;color:var(--muted)}
.chip.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.plts{display:flex;align-items:center;gap:3px;margin:10px 0;min-height:64px}
.plts .barend{width:26px;height:10px;background:var(--muted);border-radius:2px}
.plts .plt{display:flex;align-items:center;justify-content:center;width:22px;border-radius:3px;background:var(--accent);color:#fff;font:600 10px var(--mono);writing-mode:vertical-rl;transform:rotate(180deg)}
.mstat{display:block;padding:10px 14px;border-radius:6px;font-weight:600;border:1px solid currentColor;background:color-mix(in srgb,currentColor 9%,transparent)}
.mstat[hidden]{display:none}
.mstat.extra,.mstat.done{color:var(--good)}.mstat.behind{color:var(--warn)}.mstat.late,.mstat.done.late{color:var(--bad)}.mstat.idle{color:var(--muted)}
.mclock{font-family:var(--display);font-weight:800;font-size:64px;line-height:1.05;font-variant-numeric:tabular-nums;color:var(--accent)}
.mclock.over{color:var(--warn)}
.mrow .mark{width:20px;text-align:center;color:var(--muted)}
.mrow.done .mark{color:var(--good)}.mrow.cur .mark{color:var(--accent)}
.mrow.done .grow,.mrow.skip .grow{color:var(--muted);text-decoration:none}
@media (max-width:520px){.mtime{display:none}}
.exnote{font-size:13px;color:var(--muted);font-style:italic;margin:4px 0 0;white-space:pre-wrap;overflow-wrap:anywhere;border-left:2px solid var(--accent);padding-left:8px;font-weight:400}
.notebox{margin-top:8px}.notebox textarea{min-height:56px;margin:6px 0 10px}
.prow{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.prow .ptime{width:48px;flex:none;color:var(--muted);font-size:13px}
.prow.done .grow{text-decoration:line-through;color:var(--muted)}
.prow.blk{color:var(--muted)}
.prow.cur{background:color-mix(in srgb,var(--accent) 9%,transparent);border-left:3px solid var(--accent);padding-left:8px;border-radius:6px}
.prow input[type=checkbox]{flex:none}
.gapli{padding:0 0 0 56px;list-style:none;border:0}
.nowline{display:flex;align-items:center;gap:8px;color:var(--accent);font:600 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;border:0;padding:2px 0;list-style:none}
.nowline::before,.nowline::after{content:"";flex:1;height:1px;background:var(--accent)}
.toastbtn{margin-left:14px;background:none;border:1px solid currentColor;color:inherit;border-radius:4px;padding:2px 10px;font-weight:600;cursor:pointer}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:6px;font-size:14px;z-index:40;max-width:90vw}
.focusline{display:flex;flex-direction:column;gap:6px}
.focusline .q{color:var(--muted);font-style:italic}
.focusline input{font-size:17px;padding:10px 12px}
.login{min-height:calc(100vh - 80px);display:grid;place-items:center;padding:24px 0}
.login-card{width:100%;max-width:400px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:28px 24px;display:flex;flex-direction:column;gap:14px}
.login-card .brand{font-size:26px}
.login-card h2{font-size:30px}
.login-form{display:flex;flex-direction:column;gap:6px}
.login-form input{width:100%;font-size:16px;padding:11px 12px}
.login-form .lab2{margin-top:8px}
.login-form .row{margin-top:14px}
.linkbtn{background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer;padding:4px 0;align-self:flex-start;font-size:13px}
.linkbtn:hover{color:var(--accent)}
@media (prefers-reduced-motion:no-preference){.bar>i,.ring .val{transition:all .35s ease}}

<script>
/* ===== Supabase data layer =====
   One row per user in public.dashboard_state holds the whole dashboard as JSON.
   Config comes from the two constants below, or (if they still say YOUR_...) from the setup form in Settings,
   which stores them in this browser only. */
(function () {
  var SUPABASE_URL = 'https://ctpgfenlqvzgfhcveovi.supabase.co';
  var SUPABASE_ANON_KEY = 'sb_publishable_qDLp-eHYmQ2rz_3TsAycGw_f3sUta5H'; // public key, safe in the page because row level security protects the data
  var TABLE = 'dashboard_state';

  var LS_STATE = 'command-centre-v2', LS_CFG = 'cc-supabase-config', LS_LAST = 'cc-last-user',
      LS_DIRTY = 'cc-dirty', LS_BACKUP = 'cc-backup-before-sync';

  function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  function lsDel(k) { try { localStorage.removeItem(k); } catch (e) {} }

  function real(v) { return !!v && v.indexOf('YOUR_') !== 0; }
  var fromFile = real(SUPABASE_URL) && real(SUPABASE_ANON_KEY);
  var url = fromFile ? SUPABASE_URL : '', key = fromFile ? SUPABASE_ANON_KEY : '';
  if (!fromFile) {
    try { var c = JSON.parse(lsGet(LS_CFG) || 'null'); if (c && c.url && c.key) { url = c.url; key = c.key; } } catch (e) {}
  }
  var configured = !!(url && key);
  var libOk = !!window.supabase;
  var sb = null;
  if (configured && libOk) {
    try { sb = window.supabase.createClient(url, key, { auth: { persistSession: true, autoRefreshToken: true } }); } catch (e) { sb = null; }
  }
  var session = null, cc = null, busy = false;

  function hhmm() { var d = new Date(); return ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2); }
  function readCache() { try { var s = lsGet(LS_STATE); return s ? JSON.parse(s) : null; } catch (e) { return null; } }
  function writeCache(state) { lsSet(LS_STATE, JSON.stringify(state)); }
  function niceError(e) {
    var m = (e && e.message) || 'Something went wrong.';
    if (/relation .* does not exist|schema cache|PGRST205/i.test(m)) return 'Table missing. Run the SQL setup in Supabase first.';
    if (/permission denied/i.test(m)) return 'Permission denied. Re-run supabase-setup.sql in Supabase (it grants table access).';
    if (/Invalid API key|apikey/i.test(m)) return 'Supabase rejected the API key. Check it in Settings.';
    if (/Failed to fetch|NetworkError|network/i.test(m)) return 'No connection to Supabase.';
    return m;
  }

  async function upload(state) {
    var r = await sb.from(TABLE).upsert({ user_id: session.user.id, data: state, updated_at: new Date().toISOString() });
    if (r.error) throw r.error;
    lsDel(LS_DIRTY);
    lsSet(LS_LAST, session.user.id);
  }

  function typing() { var a = document.activeElement; return !!a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName); }

  async function pull(quiet) {
    if (!sb || !session || !cc || busy) return;
    busy = true;
    if (quiet !== true) cc.setStatus('Syncing…');
    try {
      var r = await sb.from(TABLE).select('data').eq('user_id', session.user.id).maybeSingle();
      if (r.error) throw r.error;
      var remote = r.data && r.data.data;
      var local = cc.getState();
      if (remote && remote.habits) {
        var neverSynced = lsGet(LS_LAST) !== session.user.id;
        if (neverSynced || (remote.updated || 0) > (local.updated || 0)) {
          if (neverSynced) lsSet(LS_BACKUP, JSON.stringify(local)); // keep this device's old data, just in case
          writeCache(remote);
          cc.replaceState(remote);
          lsSet(LS_LAST, session.user.id); lsDel(LS_DIRTY);
          cc.setStatus('Synced ' + hhmm() + (neverSynced ? '. Loaded your cloud data.' : ''));
        } else if ((local.updated || 0) > (remote.updated || 0) || lsGet(LS_DIRTY)) {
          await upload(local);
          cc.setStatus('Synced ' + hhmm());
        } else {
          lsSet(LS_LAST, session.user.id);
          if (quiet !== true) cc.setStatus('Synced ' + hhmm());
        }
      } else {
        await upload(local); // first time for this account: push what is on this device
        cc.setStatus('Synced ' + hhmm());
      }
    } catch (e) {
      cc.setStatus(niceError(e));
    }
    busy = false;
  }

  // Live updates: another device saves, this one updates within a second or two.
  var chan = null;
  function applyRemote(remote) {
    var local = cc.getState();
    if ((remote.updated || 0) <= (local.updated || 0)) return; // our own echo, or older
    if (typing()) { setTimeout(function () { applyRemote(remote); }, 4000); return; }
    writeCache(remote);
    cc.replaceState(remote);
    cc.setStatus('Synced ' + hhmm());
  }
  function subscribe() {
    if (chan || !sb || !session) return;
    try {
      chan = sb.channel('dashboard-' + session.user.id)
        .on('postgres_changes', { event: '*', schema: 'public', table: TABLE, filter: 'user_id=eq.' + session.user.id },
          function (p) { var row = p && p.new; if (row && row.data && row.data.habits) applyRemote(row.data); })
        .subscribe();
    } catch (e) { chan = null; }
  }
  function unsubscribe() { if (chan) { try { sb.removeChannel(chan); } catch (e) {} chan = null; } }

  function setSession(s) {
    var had = session && session.user.id;
    session = s;
    if (!cc) return;
    if (s && had !== s.user.id) { subscribe(); pull().then(function () { cc.refresh(); }); }
    else {
      if (!s) { unsubscribe(); cc.setStatus('Signed out. Saved on this device only.'); }
      cc.refresh();
    }
  }

  window.CCData = {
    load: readCache,

    save: async function (state) {
      writeCache(state);
      if (!sb || !session) return 'Saved on this device';
      try { await upload(state); } catch (e) { lsSet(LS_DIRTY, '1'); throw e; }
      return 'Synced ' + hhmm();
    },

    pull: function () { return pull(); },
    authReady: false,

    start: function (api) {
      cc = api;
      if (!configured) { cc.setStatus('Cloud sync is off'); return; }
      if (!sb) { cc.setStatus('Could not load the Supabase library. Check your connection.'); return; }
      cc.setStatus('Signed out');
      sb.auth.getSession().then(
        function (r) { window.CCData.authReady = true; setSession(r.data.session); },
        function () { window.CCData.authReady = true; setSession(null); });
      // Never await other Supabase calls inside this callback.
      sb.auth.onAuthStateChange(function (_e, s) { setTimeout(function () { setSession(s); }, 0); });
      function wake() { if (!document.hidden && session) { if (lsGet(LS_DIRTY)) { var l = cc.getState(); upload(l).then(function () { cc.setStatus('Synced ' + hhmm()); }, function () {}); } pull(); } }
      document.addEventListener('visibilitychange', wake);
      window.addEventListener('online', wake);
      // Fallback for when live updates are unavailable: check every 30 seconds while the tab is open.
      setInterval(function () { if (session && !document.hidden && !typing()) pull(true); }, 30000);
    },

    needsSetup: function () { return !configured; },
    saveConfig: function (u, k) { lsSet(LS_CFG, JSON.stringify({ url: u, key: k })); },
    clearConfig: fromFile ? undefined : function () { lsDel(LS_CFG); lsDel(LS_LAST); lsDel(LS_DIRTY); },

    auth: sb ? {
      user: function () { return session ? session.user : null; },
      signIn: async function (email, password) {
        var r = await sb.auth.signInWithPassword({ email: email, password: password });
        if (r.error) throw r.error;
      },
      signUp: async function (email, password) {
        var r = await sb.auth.signUp({ email: email, password: password });
        if (r.error) throw r.error;
        return { confirmEmail: !r.data.session };
      },
      signOut: async function () { var r = await sb.auth.signOut(); if (r && r.error) throw r.error; }
    } : undefined
  };
})();
</script>

/* recurring events: e.date is the first day, e.rec is daily|weekly|monthly|yearly, e.skip lists removed days */
var RECS=[['','Does not repeat'],['daily','Every day'],['weekly','Every week'],['monthly','Every month'],['yearly','Every year']];
function recLabel(r){var x=RECS.filter(function(y){return y[0]===r})[0];return x&&r?x[1].toLowerCase():''}
function dimOf(y,m){return new Date(y,m+1,0).getDate()}
function occursOn(e,k){
  if(k<e.date)return false;
  if(k===e.date)return !(e.skip&&e.skip.indexOf(k)>-1);
  if(!e.rec)return false;
  if(e.skip&&e.skip.indexOf(k)>-1)return false;
  var a=parse(e.date),b=parse(k);
  if(e.rec==='daily')return true;
  if(e.rec==='weekly')return Math.round((b-a)/864e5)%7===0;
  if(e.rec==='monthly')return b.getDate()===Math.min(a.getDate(),dimOf(b.getFullYear(),b.getMonth()));
  if(e.rec==='yearly')return b.getMonth()===a.getMonth()&&b.getDate()===Math.min(a.getDate(),dimOf(b.getFullYear(),b.getMonth()));
  return false;
}

/* done, due, or rest (a rest day follows a completion; a habit repeating every N days is due again N days after the last one) */
function habitState(h,k){
  if(h.days[k])return 'done';
  var n=habitEvery(h);
  if(n>1){var d=parse(k);for(var i=1;i<n;i++){if(h.days[iso(addDays(d,-i))])return 'rest'}}
  return 'due';
}
function habitStreak(h){
  var n=habitEvery(h),d=new Date();
  if(n===1){if(!h.days[iso(d)])d=addDays(d,-1);var c=0;while(h.days[iso(d)]){c++;d=addDays(d,-1)}return c}
  var last=null;for(var i=0;i<=n;i++){var k=iso(addDays(d,-i));if(h.days[k]){last=k;break}}
  if(!last)return 0;
  var cnt=1,cur=parse(last);
  for(;;){var found=false;for(var g=1;g<=n;g++){var k2=iso(addDays(cur,-g));if(h.days[k2]){cnt++;cur=addDays(cur,-g);found=true;break}}if(!found)break}
  return cnt;
}

V['gym-stats']=function(){
  if(ui.exDetail)return exDetailView();
  var by={};
  S.workouts.forEach(function(w){w.entries.forEach(function(e){if(!e.sets.length)return;var b=bestSet(e.sets);(by[e.name]=by[e.name]||[]).push({d:w.date,w:b.w,r:b.r,v:e1rm(b.w,b.r)})})});
  var names=Object.keys(by).sort();
  var wkStart=iso(mondayOf(new Date()));
  var vol=0;S.workouts.forEach(function(w){if(w.date>=wkStart)w.entries.forEach(function(e){e.sets.forEach(function(s){vol+=s.w*s.r})})});
  var cut=iso(addDays(new Date(),-30)),prn=0;names.forEach(function(n){exHistory(n).forEach(function(x){if(x.pr&&x.d>=cut)prn++})});
  var cards=names.map(function(n){
    var a=by[n],f=a[0],l=a[a.length-1],ch=f.v?((l.v-f.v)/f.v*100):0;
    var mx=Math.max.apply(null,a.map(function(x){return x.v})),mn=Math.min.apply(null,a.map(function(x){return x.v})),rg=(mx-mn)||1;
    var pts=a.map(function(x,i){return (a.length===1?150:8+i*(284/(a.length-1)))+','+(48-(x.v-mn)/rg*40)});
    var lastPt=pts[pts.length-1].split(',');
    return '<div class="panel"><div class="row" style="justify-content:space-between"><h3 style="margin:0;font-size:17px;text-transform:none;letter-spacing:.01em;font-family:var(--body);font-weight:600">'+esc(n)+'</h3><span class="row">'+(exHistory(n).slice(-1)[0].pr?'<span class="pill">PR</span>':'')+'<span class="mono '+(ch>=0?'up':'down')+'">'+(ch>=0?'+':'')+ch.toFixed(1)+'%</span></span></div>'+
    '<svg class="spark" viewBox="0 0 300 56" preserveAspectRatio="none" role="img" aria-label="Estimated 1RM trend"><polyline points="'+pts.join(' ')+'"/><circle cx="'+lastPt[0]+'" cy="'+lastPt[1]+'" r="3.5"/></svg>'+
    '<div class="row mono" style="justify-content:space-between;font-size:13px"><span>Last: '+l.w+' kg × '+l.r+'</span><span>Est. 1RM '+l.v.toFixed(1)+' kg</span></div><div class="hint" style="margin-top:4px">'+a.length+' session'+(a.length===1?'':'s')+' · first 1RM '+f.v.toFixed(1)+' kg</div><div style="margin-top:10px"><button class="btn ghost sm" data-act="exdetail" data-n="'+esc(n)+'">History &amp; chart ›</button></div></div>'}).join('');
  var recent=S.workouts.slice(-5).reverse().map(function(w){return '<li><span class="mono muted">'+w.date+'</span><span class="grow">'+esc(w.name||'Workout')+(w.prs?' <span class="pill">'+w.prs+' PR'+(w.prs>1?'s':'')+'</span>':'')+'</span><span class="hint">'+w.entries.reduce(function(a,e){return a+e.sets.length},0)+' sets</span>'+delBtn('workout',w.id)+'</li>'}).join('');
  return head('Gym stats &amp; progression','Estimated 1RM uses the Epley formula: weight × (1 + reps ÷ 30).')+
  '<div class="grid"><div class="tile" style="cursor:default"><span class="lab">Sessions logged</span><span class="big">'+S.workouts.length+'</span></div><div class="tile" style="cursor:default"><span class="lab">Volume this week</span><span class="big">'+fmtN(vol)+'<span style="font-size:18px"> kg</span></span></div><div class="tile" style="cursor:default"><span class="lab">PRs, last 30 days</span><span class="big">'+prn+'</span></div></div>'+
  (names.length?'<div class="grid">'+cards+'</div><div class="panel"><h3>Recent sessions</h3><ul class="list">'+recent+'</ul></div>':'<div class="empty">No workouts logged yet. Start a live session from Gym Plan and your lifts appear here.</div>');

function weekStats(ws){
  var td=today(),dates=[],el=[],i;
  for(i=0;i<7;i++){var k=iso(addDays(ws,i));dates.push(k);if(k<=td)el.push(k)}
  var hDone=0,hTot=0,per=S.habits.map(function(h){var c=el.filter(function(k){return h.days[k]}).length,t=el.filter(function(k){return habitState(h,k)!=='rest'}).length;hDone+=c;hTot+=t;return {n:h.name,c:c,t:t}});
  var wk=S.workouts.filter(function(w){return dates.indexOf(w.date)>-1}),vol=0,sets=0;
  wk.forEach(function(w){w.entries.forEach(function(e){e.sets.forEach(function(s){sets++;vol+=s.w*s.r})})});
  var logged=el.filter(function(k){return kcalOn(k)>0}),kc=logged.reduce(function(a,k){return a+kcalOn(k)},0);
  var foc=dates.reduce(function(a,k){return a+(S.sessions[k]||0)},0);
  var evn=dates.reduce(function(a,k){return a+eventsOn(k).length},0);
  var inW=wKeys().filter(function(k){return dates.indexOf(k)>-1}),wc=null,wnow=null;
  if(inW.length){wnow=S.weights[inW[inW.length-1]];var b=wOnOrBefore(iso(addDays(ws,-1)));wc=b?wnow-b.v:(inW.length>1?wnow-S.weights[inW[0]]:null)}
  var pTot=0,pDone=0;dates.forEach(function(k){pGet(k).forEach(function(t){pTot++;if(t.done)pDone++})});
  var rKmW=0,rN=0;S.runs.forEach(function(r){if(dates.indexOf(r.date)>-1){rKmW+=r.km;rN++}});
  var mRan=0,mOn=0;dates.forEach(function(k){var l=S.mlog[k];if(l&&l.fin){mRan++;if(l.late<=0)mOn++}});
  return {rKmW:rKmW,rN:rN,pTot:pTot,pDone:pDone,mRan:mRan,mOn:mOn,dates:dates,el:el.length,hDone:hDone,hTot:hTot,hPct:hTot?Math.round(hDone/hTot*100):null,per:per,wk:wk.length,sets:sets,vol:vol,logged:logged.length,avgKc:logged.length?Math.round(kc/logged.length):null,foc:foc,evn:evn,wnow:wnow,wc:wc};
}

function musInfo(d){
  var m=ui.mSel;if(!m)return '<p class="hint" style="text-align:center;margin:8px 0 0">Tap a muscle to see its name.</p>';
  var days=[],ex=[];for(var i=0;i<7;i++){if(dayMus(i)[m])days.push(DOW[i].slice(0,3))}
  S.routines[d].ex.forEach(function(e){if(exMus(e.name).indexOf(m)>=0)ex.push(e.name)});
  return '<div class="musinfo"><b>'+esc(MUSN[m]||m)+'</b><span>'+(days.length?'Trained: '+days.join(', '):'Not trained this week')+'</span>'+(ex.length?'<span>'+esc(DOW[d])+': '+esc(ex.join(', '))+'</span>':'')+'</div>';
}
function muscleCard(){
  var d=ui.planDay,dm=dayMus(d),keys=Object.keys(dm),lv={},wk=[],mx=1;

  else keys.forEach(function(k){lv[k]=1});

  var title=ui.mWeek?'Whole week':(S.routines[d].name||DOW[d]);

  var tbl='<div class="mtbl"><table><thead><tr><th></th>'+DOW.map(function(x,i){return '<th><button class="mday'+(i===d&&!ui.mWeek?' on':'')+'" data-act="plan" data-d="'+i+'" aria-label="Show '+x+'">'+x[0]+'</button></th>'}).join('')+'</tr></thead><tbody>'+MUS.filter(function(m){return all.some(function(x){return x[m[0]]})}).map(function(m){return '<tr><td>'+m[1]+'</td>'+all.map(function(x,i){return '<td class="'+(i===d&&!ui.mWeek?'sel':'')+'">'+(x[m[0]]?'<span class="dot"></span>':'')+'</td>'}).join('')+'</tr>'}).join('')+'</tbody></table></div>';

   musInfo(d)+'<p class="muted" style="text-align:center;margin:4px 0 12px"><b>'+esc(title)+'</b>: '+esc(legend)+'</p>'+tbl+
   (never.length?'<p class="hint" style="margin:10px 0 0">Not trained this week: '+esc(never.join(', '))+'.</p>':'<p class="hint" style="margin:10px 0 0">Every muscle group is trained at least once this week.</p>')+
   '<p class="hint" style="margin:6px 0 0">Muscles come from each exercise. Set them under Edit exercise list. Unset exercises are guessed from their name.</p></div>';

function exNote(n){return (S.exnotes&&S.exnotes[n])||''}
function setExNote(n,v){S.exnotes=S.exnotes||{};v=String(v||'').trim();if(v)S.exnotes[n]=v;else delete S.exnotes[n]}
function exList(){return Array.isArray(S.exlist)?S.exlist:[]}
function exHas(n){var l=n.toLowerCase();return exList().some(function(x){return x.toLowerCase()===l})}
function exAdd(n){n=n.trim();if(n&&!exHas(n)){S.exlist=exList().concat(n);return true}return false}
function exOptions(sel){return exList().map(function(x){return '<option'+(x===sel?' selected':'')+'>'+esc(x)+'</option>'}).join('')+'<option value="__custom">Custom…</option>'}
function histBest(name){var b=0;S.workouts.forEach(function(w){w.entries.forEach(function(e){if(e.name===name)e.sets.forEach(function(x){if(x.w>0)b=Math.max(b,e1rm(x.w,x.r))})})});return b}
function exHistory(name){
  var out=[];
  S.workouts.forEach(function(w,wi){w.entries.forEach(function(e){if(e.name!==name||!e.sets.length)return;
    var top=0,vol=0,v=0;e.sets.forEach(function(x){top=Math.max(top,x.w);vol+=x.w*x.r;v=Math.max(v,e1rm(x.w,x.r))});
    out.push({d:w.date,i:wi,sets:e.sets,top:top,vol:vol,v:v,pr:false,note:e.note||''})})});
  out.sort(function(a,b){return a.d<b.d?-1:a.d>b.d?1:a.i-b.i});
  var run=0;out.forEach(function(x,i){if(i>0&&run>0&&x.top>0&&x.v>run)x.pr=true;if(x.top>0)run=Math.max(run,x.v)});
  return out;
}
function sugFor(name,tr){
  var last=null;for(var i=S.workouts.length-1;i>=0&&!last;i--){var e=S.workouts[i].entries.filter(function(x){return x.name===name&&x.sets.length})[0];if(e)last=e}
  if(!last)return null;
  var top=0;last.sets.forEach(function(x){top=Math.max(top,x.w)});
  var hit=last.sets.filter(function(x){return x.w===top}).every(function(x){return x.r>=tr});
  if(top<=0)return hit?{text:'You hit '+tr+' reps on every set last time. Try one more rep per set.',w:null}:null;
  if(hit){var w=top+(top>=20?2.5:1);return {text:'You hit '+tr+' reps at '+top+' kg last time. Try '+w+' kg × '+tr+'.',w:w}}
  return {text:'Aim for '+tr+' reps at '+top+' kg before adding weight.',w:top};
}

var PDUR=[[0,'No length'],[15,'15 min'],[30,'30 min'],[45,'45 min'],[60,'1 hour'],[90,'1.5 hours'],[120,'2 hours'],[180,'3 hours']];
function pGet(k){return S.plan[k]||[]}
function pFmt(m){m=((m%1440)+1440)%1440;return pad(Math.floor(m/60))+':'+pad(m%60)}
function durText(m){var h=Math.floor(m/60),r=m%60;return h?(r?h+'h '+r+'m':h+'h'):r+'m'}
function nowMin(){var d=new Date();return d.getHours()*60+d.getMinutes()}
function pItems(k){
  var out=[];
  pGet(k).forEach(function(t){if(t.time)out.push({kind:'task',t:t,start:hm(t.time),end:hm(t.time)+(t.dur||0)})});
  eventsOn(k).forEach(function(e){if(e.time)out.push({kind:'event',e:e,start:hm(e.time),end:hm(e.time)})});
  if(S.morn.steps.length)out.push({kind:'morning',start:hm(S.morn.start),end:hm(S.morn.end)});
  return out.sort(function(a,b){return a.start-b.start||a.end-b.end});
}
function pNext(k,nm){
  var cur=null,next=null;
  pGet(k).filter(function(t){return t.time&&!t.done}).sort(function(a,b){return hm(a.time)-hm(b.time)}).forEach(function(t){
    var st=hm(t.time),en=st+(t.dur||0);
    if(!cur&&t.dur&&st<=nm&&nm<en)cur=t;
    else if(!next&&st>nm)next=t;
  });
  return {cur:cur,next:next};
}
function pRow(t,opts){

  return '<li'+(opts.grip?' data-row':'')+' class="prow'+(t.done?' done':'')+(opts.cur?' cur':'')+'">'+(opts.grip?grip('plan',t.title):'')+(opts.lead||'')+
    '<input type="checkbox" data-chg="pdone" data-id="'+t.id+'"'+(t.done?' checked':'')+' aria-label="Done: '+esc(t.title)+'"><span class="grow">'+esc(t.title)+(t.dur?' <span class="hint">'+durText(t.dur)+'</span>':'')+'</span>'+

function hm(t){var p=String(t||'0:0').split(':');return (+p[0]||0)*60+(+p[1]||0)}
function mAt(t,base){var d=new Date(base||Date.now());d.setHours(0,0,0,0);return d.getTime()+hm(t)*60000}
function mAdvance(skip){
  var log=S.mlog[today()];if(!log||log.fin)return;
  var st=mState(Date.now());if(!st.cur)return;
  var now=Date.now();log.steps[st.cur.id]=skip?{t:now,skip:true}:{t:now};
  if(S.morn.steps.every(function(x){return log.steps[x.id]})){
    log.fin=now;log.dl=mAt(S.morn.end,now);log.late=Math.round((now-log.dl)/60000);
    toast(log.late<=0?'Morning done. Nice.':'Morning done, '+log.late+' min late.');
  }
  save();render();
}
function mClock(ts){var d=new Date(ts);return pad(d.getHours())+':'+pad(d.getMinutes())}
function mTotal(){return S.morn.steps.reduce(function(a,x){return a+x.min},0)}
function mState(now){
  var m=S.morn,log=S.mlog[today()]||null,total=mTotal(),dl=mAt(m.end,now),startBy=dl-total*60000,cur=null,curIdx=-1,curStart=0,t=log?log.start:now,rows=[];
  m.steps.forEach(function(x,i){
    var r=log&&log.steps[x.id];
    if(r){rows.push({s:x,state:r.skip?'skip':'done',actual:Math.round((r.t-t)/60000)});t=r.t}
    else if(log&&!log.fin&&!cur){cur=x;curIdx=i;curStart=t;rows.push({s:x,state:'cur'})}
    else rows.push({s:x,state:'todo'});
  });
  var spent=cur?now-curStart:0,curLeft=cur?cur.min*60000-spent:0,pt=now;
  rows.forEach(function(r){
    if(r.state==='cur'){r.pStart=curStart;pt=now+Math.max(0,curLeft);r.pEnd=pt}
    else if(r.state==='todo'){r.pStart=pt;pt+=r.s.min*60000;r.pEnd=pt}
  });
  var out={log:log,rows:rows,cur:cur,curIdx:curIdx,curLeft:curLeft,dl:dl,startBy:startBy,total:total,projFin:pt,started:!!log,kind:'idle',n:0,text:''};
  if(log&&log.fin){
    var d=Math.round((log.fin-dl)/60000);out.kind='done';out.n=Math.abs(d);
    out.text=d<0?'Ready '+(-d)+' min early':d===0?'Ready right on time':'Ready '+d+' min late';
    out.late=d>0;return out;
  }
  if(!log&&!(now>=startBy-90*60000&&now<=dl+60*60000))return out;
  if(!m.steps.length)return out;
  var slack=(dl-pt)/60000,skipTip=' Skip a step or speed up to be ready by '+m.end+'.';
  if(now>dl){out.kind='late';out.n=Math.max(1,Math.ceil((now-dl)/60000));out.text=log?'Late by '+out.n+' min. You were due to be ready by '+m.end+'.':'Already '+out.n+' min past your ready-by time of '+m.end+'.'}
  else if(slack<0){out.kind='behind';out.n=Math.ceil(-slack);out.text=log?'Behind by '+out.n+' min.'+skipTip:'If you start now, you will be '+out.n+' min behind.'+skipTip}
  else{out.kind='extra';out.n=Math.round(slack);out.text=log?(out.n>0?'Extra time: '+out.n+' min to spare.':'On schedule, with no spare time.'):(out.n>0?'If you start now, you have '+out.n+' min to spare.':'If you start now, you are on schedule with no spare time.')}
  return out;
}
function mRowsHtml(st){
  return st.rows.map(function(r){
    var x=r.s,hint,mark;
    if(r.state==='done'){mark='✓';var dv=r.actual-x.min;hint=r.actual+' min'+(dv>0?' (+'+dv+')':dv<0?' ('+dv+')':'')}
    else if(r.state==='skip'){mark='–';hint='skipped'}
    else{mark=r.state==='cur'?'▶':'○';hint=mClock(r.pStart)+' → '+mClock(r.pEnd)}
    return '<li class="mrow '+r.state+'"><span class="mark" aria-hidden="true">'+mark+'</span><span class="grow">'+(r.state==='cur'?'<b>'+esc(x.name)+'</b>':esc(x.name))+' <span class="hint">'+x.min+' min</span></span><span class="hint">'+hint+'</span></li>';
  }).join('');
}
function mClockHtml(st){
  if(!st.cur)return '';
  var left=Math.round(st.curLeft/1000),over=left<0,a=Math.abs(left);
  return (over?'+':'')+pad(Math.floor(a/60))+':'+pad(a%60);
}
function paintMorning(){
  if(ui.view!=='morning')return;
  var st=mState(Date.now()),c=$('#mchip'),k=$('#mclock'),r=$('#mrows');

  if(k){k.textContent=mClockHtml(st);k.className='mclock'+(st.cur&&st.curLeft<0?' over':'')}

function plateSplit(total){
  var bar=S.barKg>0?S.barKg:20,avail=(S.plates||[]).filter(function(x){return x>0}).sort(function(a,b){return b-a});
  if(!(total>0))return null;
  if(total<bar-1e-9)return {err:'That is lighter than the '+bar+' kg bar.'};
  var left=(total-bar)/2,out=[];
  avail.forEach(function(q){while(left+1e-9>=q){out.push(q);left-=q}});
  var got=bar+2*out.reduce(function(a,b){return a+b},0);
  return {plates:out,total:got,exact:Math.abs(got-total)<1e-6,bar:bar};
}
function plateText(r){return r.plates.length?r.plates.join(' + ')+' per side':'Just the bar'}

  var r=plateSplit(total);

  if(r.err)return '<div class="hint">'+esc(r.err)+'</div>';
  var viz='<div class="plts" aria-hidden="true"><span class="barend"></span>'+r.plates.map(function(q){return '<span class="plt" style="height:'+Math.round(26+Math.min(q,25)*1.6)+'px">'+q+'</span>'}).join('')+'</div>';
  return viz+'<div class="mono"><b>'+plateText(r)+'</b></div><div class="hint">'+r.bar+' kg bar'+(r.exact?' · '+fmtKg(r.total)+' kg total':'')+'</div>'+(r.exact?'':'<div class="hint" style="color:var(--warn)">Closest you can load with your plates: '+fmtKg(r.total)+' kg ('+fmtKg(Math.abs(total-r.total))+' kg '+(r.total<total?'short':'over')+').</div>');
}

function lineChart(pts,unit,label){
  var vals=pts.map(function(p){return p.v}),mn=Math.min.apply(null,vals),mx=Math.max.apply(null,vals);if(mx-mn<1){mn-=.5;mx+=.5}

  var X=function(k){return pts.length===1?160:34+(parse(k).getTime()-t0)/span*252},Y=function(v){return 102-(v-mn)/(mx-mn)*90};
  var short=function(k){return parse(k).toLocaleDateString('en-GB',{day:'numeric',month:'short'})};

  return '<svg class="chart" viewBox="0 0 300 126" style="width:100%;max-width:560px;display:block" role="img" aria-label="'+esc(label)+'"><text x="30" y="'+(Y(mx-pd)+3).toFixed(1)+'" style="text-anchor:end">'+Math.round(mx-pd)+'</text><text x="30" y="'+(Y(mn+pd)+3).toFixed(1)+'" style="text-anchor:end">'+Math.round(mn+pd)+'</text>'+

}

var mini={set:300,rem:300,end:0,run:false,done:false};
function miniLoad(){
  mini.set=Math.max(1,Math.min(180,S.miniMin||5))*60;mini.rem=mini.set;mini.run=false;mini.done=false;
  try{var j=JSON.parse(localStorage.getItem('cc-mini')||'null');
    if(j&&typeof j.rem==='number'){mini.rem=j.rem;mini.end=j.end||0;mini.run=!!j.run;
      if(mini.run&&mini.end<=Date.now()){mini.run=false;mini.rem=0;mini.done=true}}}catch(e){}
}
function miniStore(){try{localStorage.setItem('cc-mini',JSON.stringify({rem:mini.rem,end:mini.end,run:mini.run}))}catch(e){}}
function miniLeft(){return mini.run?Math.max(0,(mini.end-Date.now())/1000):mini.rem}
function miniRender(){
  var el=$('#mini');if(!el)return;
  el.className='minit'+(mini.run?' run':'')+(mini.done?' done':'');
  var idle=!mini.run&&mini.rem===mini.set&&!mini.done;
  el.innerHTML='<button data-act="miniminus" aria-label="One minute less" title="One minute less">'+ic('minus')+'</button>'+
    '<span class="mt" id="mt" role="timer" aria-live="off">'+fmtT(miniLeft())+'</span>'+
    '<button data-act="miniplus" aria-label="One minute more" title="One minute more">'+ic('plus')+'</button>'+
    '<button data-act="miniplay" aria-label="'+(mini.run?'Pause timer':'Start timer')+'" title="'+(mini.run?'Pause':'Start')+'">'+ic(mini.run?'pause':'play')+'</button>'+
    (idle||mini.run?'':'<button data-act="minireset" aria-label="Reset timer" title="Reset">'+ic('reset')+'</button>');
}
function miniTick(){
  if(!mini.run)return;
  var left=(mini.end-Date.now())/1000;
  if(left<=0){mini.run=false;mini.rem=0;mini.done=true;miniStore();miniRender();beep(1);setTimeout(function(){beep(1)},650);toast('Timer finished.');return}
  var t=$('#mt');if(t)t.textContent=fmtT(left);
}
function miniAdjust(d){
  var wasIdle=!mini.run&&mini.rem===mini.set&&!mini.done,wasDone=mini.done;
  var base=wasDone?mini.set:miniLeft();
  var next=Math.max(wasIdle||wasDone?60:1,Math.min(180*60,base+d*60));
  mini.done=false;
  if(mini.run){mini.end=Date.now()+next*1000}else{mini.rem=next}
  if(wasIdle||wasDone){mini.set=next;S.miniMin=Math.round(next/60);save()}
  miniStore();miniRender();
}
function miniSync(){if(!mini.run&&mini.rem===mini.set&&!mini.done){mini.set=Math.max(1,Math.min(180,S.miniMin||5))*60;mini.rem=mini.set;miniStore();miniRender()}}
A.miniminus=function(){miniAdjust(-1)};
A.miniplus=function(){miniAdjust(1)};
A.miniplay=function(){
  if(mini.run){mini.rem=miniLeft();mini.run=false}
  else{if(mini.rem<=0||mini.done){mini.rem=mini.set;mini.done=false}mini.end=Date.now()+mini.rem*1000;mini.run=true;beep(0)}
  miniStore();miniRender();
};
A.minireset=function(){mini.rem=mini.set;mini.run=false;mini.done=false;miniStore();miniRender()};

  var nm=nowMin(),tk=today();

  if(ui.view==='planner'&&ui.pMin!==nm){ui.pMin=nm;var ae=document.activeElement;if(!(ae&&/^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName)))render()}
},1000);
function tick(){var d=new Date();var td0=iso(d);if(ui.day&&ui.day!==td0){if(ui.pDate===ui.day)ui.pDate=td0;ui.day=td0;var ae=document.activeElement;if(!(ae&&/^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName)))render()}var e=$('#clock');if(e)e.innerHTML=pad(d.getHours())+':'+pad(d.getMinutes())+'<span class="sec">:'+pad(d.getSeconds())+'</span>'}
tick();setInterval(tick,1000);

/* ---------- events ---------- */
document.addEventListener('click',function(e){
  var el=e.target.closest('[data-act]');
  if(!el){if(ui.confirm){ui.confirm=null;var inForm=e.target.closest('input,textarea,select');if(!inForm)render()}return}
  var f=A[el.dataset.act];if(f)f(el,e);
});
document.addEventListener('submit',function(e){
  var f=e.target.closest('[data-form]');if(!f)return;e.preventDefault();var fn=F[f.dataset.form];if(fn)fn(f,e);
});
document.addEventListener('change',function(e){
  var el=e.target;
  if(el.dataset&&el.dataset.cust){var c=$('#'+el.dataset.cust);if(c)c.hidden=el.value!=='__custom';if(c&&!c.hidden)c.focus();return}
  if(el.dataset&&el.dataset.chg&&el.dataset.chg!=='nsearch'){var fn=C[el.dataset.chg];if(fn)fn(el)}
});
document.addEventListener('input',function(e){
  var el=e.target;
  if(el.dataset&&el.dataset.live==='plates'){ui.plateW=num(el.value);var po=$('#plateout');if(po)po.innerHTML=plateHtml(ui.plateW);return}
  if(el.dataset&&el.dataset.chg==='nsearch'){ui.noteQ=el.value;var pos=el.selectionStart;render();var n=$('#ns');if(n){n.focus();n.setSelectionRange(pos,pos)}}
});
var drag=null;
function rowsOf(row){return [].slice.call(row.parentElement.children).filter(function(c){return c.hasAttribute('data-row')})}
document.addEventListener('pointerdown',function(e){
  var g=e.target.closest&&e.target.closest('[data-grip]');if(!g)return;
  var row=g.closest('[data-row]');if(!row)return;
  var rows=rowsOf(row),from=rows.indexOf(row);if(from<0)return;
  e.preventDefault();
  drag={kind:g.dataset.grip,row:row,rows:rows,from:from,to:from,y0:e.clientY,rects:rows.map(function(r){return r.getBoundingClientRect()}),h:row.getBoundingClientRect().height,id:e.pointerId};
  try{g.setPointerCapture(e.pointerId)}catch(x){}
  row.classList.add('dragging');
});
document.addEventListener('pointermove',function(e){
  if(!drag||e.pointerId!==drag.id)return;
  var dy=e.clientY-drag.y0;drag.row.style.transform='translateY('+dy+'px)';
  var c=drag.rects[drag.from].top+drag.h/2+dy,to=0;
  drag.rects.forEach(function(r,i){if(i!==drag.from&&r.top+r.height/2<c)to++});
  drag.to=to;
  drag.rows.forEach(function(r,i){if(i===drag.from)return;var sh=0;if(drag.from<to&&i>drag.from&&i<=to)sh=-drag.h;if(drag.from>to&&i<drag.from&&i>=to)sh=drag.h;r.style.transform=sh?'translateY('+sh+'px)':''});
});
function dragEnd(e){
  if(!drag||(e&&e.pointerId!==drag.id))return;
  var d=drag;drag=null;d.rows.forEach(function(r){r.style.transform='';r.classList.remove('dragging')});
  reorder(d.kind,d.from,d.to);
}
document.addEventListener('pointerup',dragEnd);document.addEventListener('pointercancel',dragEnd);
document.addEventListener('keydown',function(e){
  var g=e.target.closest&&e.target.closest('[data-grip]');if(!g||(e.key!=='ArrowUp'&&e.key!=='ArrowDown'))return;
  e.preventDefault();var row=g.closest('[data-row]'),rows=rowsOf(row),i=rows.indexOf(row),j=i+(e.key==='ArrowUp'?-1:1);
  if(j<0||j>=rows.length)return;var kind=g.dataset.grip;reorder(kind,i,j);
  var gs=document.querySelectorAll('[data-grip="'+kind+'"]');if(gs[j])gs[j].focus();
});
function setView(v){var rb=$('#railbar');if(rb)rb.classList.remove('hide');if(!V[v])v='home';if(v!=='gym-stats')ui.exDetail=null;ui.view=v;ui.confirm=null;render();window.scrollTo(0,0)}
window.addEventListener('hashchange',function(){setView(location.hash.replace('#','')||'home')});

/* ---------- boot ---------- */
(async function(){
  try{var l=await D.load();if(l)S=normalise(l)}catch(e){}
  applyTheme();
  var h=location.hash.replace('#','');ui.view=V[h]?h:'home';
  ui.t.remaining=S.focusCfg.focus*60;
  ui.day=today();
  render();
  miniLoad();miniRender();
  if(D.start)D.start(window.CC);
})();
})();
</script>
